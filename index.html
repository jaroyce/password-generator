<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="version" content="1.0.2">
<title>Strong Password Generator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e10;
    --surface: #18181c;
    --surface2: #222228;
    --border: #2e2e38;
    --accent: #00e5a0;
    --accent-dim: rgba(0,229,160,0.12);
    --accent-dim2: rgba(0,229,160,0.06);
    --text: #f0f0f5;
    --text-muted: #7a7a90;
    --text-dim: #4a4a60;
    --red: #ff4f4f;
    --amber: #ffaa00;
    --yellow: #ffe066;
    --green: #00e5a0;
    --mono: ui-monospace, 'SF Mono', SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .wrap {
    width: 100%;
    max-width: 560px;
  }

  .header {
    margin-bottom: 2.5rem;
  }

  .header h1 {
    font-family: var(--mono);
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }

  .header p {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 300;
    letter-spacing: 0.03em;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.5rem;
    margin-bottom: 1rem;
  }

  /* Password output */
  .pw-output {
    position: relative;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1rem 3.5rem 1rem 1rem;
    min-height: 64px;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    transition: border-color 0.2s;
  }

  .pw-output:hover { border-color: var(--accent); }

  #pw-text {
    font-family: var(--mono);
    font-size: 0.95rem;
    color: var(--text);
    word-break: break-all;
    line-height: 1.7;
    letter-spacing: 0.04em;
    flex: 1;
  }

  .copy-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    padding: 6px;
    border-radius: 4px;
    transition: color 0.2s, background 0.2s;
    line-height: 1;
  }

  .copy-btn:hover { color: var(--accent); background: var(--accent-dim); }
  .copy-btn svg { display: block; width: 18px; height: 18px; }

  /* Strength bar */
  .strength-track {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 0.4rem;
    overflow: hidden;
  }

  .strength-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s ease, background 0.3s ease;
    width: 0%;
  }

  .strength-meta {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-bottom: 1.25rem;
  }

  #strength-label { font-weight: 500; }

  /* Slider */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
  }

  .slider-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    min-width: 48px;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .slider-val {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--accent);
    min-width: 26px;
    text-align: right;
    font-weight: 500;
  }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  input[type=range]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* Checkboxes */
  .checks {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem 1rem;
    margin-bottom: 1.25rem;
  }

  .check-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    color: var(--text-muted);
    cursor: pointer;
    transition: color 0.15s;
    user-select: none;
  }

  .check-label:hover { color: var(--text); }

  .check-label input[type=checkbox] {
    display: none;
  }

  .check-box {
    width: 14px;
    height: 14px;
    border: 1px solid var(--border);
    border-radius: 2px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, background 0.15s;
  }

  .check-label input:checked + .check-box {
    border-color: var(--accent);
    background: var(--accent);
  }

  .check-label input:checked + .check-box::after {
    content: '';
    width: 7px;
    height: 5px;
    border-left: 1.5px solid #0e0e10;
    border-bottom: 1.5px solid #0e0e10;
    transform: rotate(-45deg) translateY(-1px);
    display: block;
  }

  /* Action buttons */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
  }

  .btn {
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.65rem 0;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
    border: 1px solid var(--border);
    background: none;
    color: var(--text-muted);
  }

  .btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .btn:active { transform: scale(0.98); }

  .btn-primary {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim2);
  }

  .btn-primary:hover { background: var(--accent-dim); }

  /* Divider */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1.25rem 0;
  }

  /* Bulk section */
  .bulk-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .bulk-header span {
    font-family: var(--mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }

  .bulk-list {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    max-height: 200px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .bulk-item {
    font-family: var(--mono);
    font-size: 0.78rem;
    padding: 0.5rem 0.75rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
  }

  .bulk-item:hover { border-color: var(--accent); color: var(--accent); }

  .bulk-item span { flex: 1; word-break: break-all; letter-spacing: 0.03em; }

  .bulk-item-hint {
    font-size: 0.65rem;
    color: var(--text-dim);
    flex-shrink: 0;
    transition: color 0.15s;
  }

  .bulk-item:hover .bulk-item-hint { color: var(--accent); }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background: var(--surface2);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    padding: 0.6rem 1rem;
    border-radius: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  #toast.show { opacity: 1; }

  /* Footer note */
  .note {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 1rem;
    line-height: 1.6;
    font-family: var(--mono);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>Password Generator</h1>
    <p>Cryptographically secure &mdash; uses <code>crypto.getRandomValues()</code></p>
  </div>

  <div class="card">
    <div class="pw-output" title="Click to copy">
      <span id="pw-text">Click generate to begin</span>
      <button class="copy-btn" onclick="copyMain()" aria-label="Copy password">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>
    </div>

    <div class="strength-track"><div class="strength-fill" id="sfill"></div></div>
    <div class="strength-meta">
      <span id="strength-label">--</span>
      <span id="entropy-label">-- bits</span>
    </div>

    <div class="slider-row">
      <span class="slider-label">Length</span>
      <input type="range" id="len" min="8" max="64" value="20" step="1" oninput="document.getElementById('len-val').textContent=this.value;generate()">
      <span class="slider-val" id="len-val">20</span>
    </div>

    <div class="checks">
      <label class="check-label"><input type="checkbox" id="uc" checked onchange="generate()"><span class="check-box"></span>Uppercase (A-Z)</label>
      <label class="check-label"><input type="checkbox" id="lc" checked onchange="generate()"><span class="check-box"></span>Lowercase (a-z)</label>
      <label class="check-label"><input type="checkbox" id="num" checked onchange="generate()"><span class="check-box"></span>Numbers (0-9)</label>
      <label class="check-label"><input type="checkbox" id="sym" checked onchange="generate()"><span class="check-box"></span>Symbols (!@#$...)</label>
      <label class="check-label"><input type="checkbox" id="amb" onchange="generate()"><span class="check-box"></span>Exclude ambiguous</label>
      <label class="check-label"><input type="checkbox" id="nodup" onchange="generate()"><span class="check-box"></span>No duplicates</label>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="generate()">&#8635; Regenerate</button>
      <button class="btn" onclick="copyMain()">&#9647; Copy to clipboard</button>
    </div>

    <hr class="divider">

    <div class="bulk-header">
      <span>Bulk generate</span>
      <div class="slider-row" style="margin:0;gap:0.5rem">
        <input type="range" id="bulk-n" min="2" max="20" value="5" step="1" style="width:80px" oninput="document.getElementById('bulk-n-val').textContent=this.value">
        <span class="slider-val" id="bulk-n-val">5</span>
        <button class="btn" style="padding:0.4rem 0.75rem;font-size:0.7rem" onclick="bulkGen()">Generate</button>
      </div>
    </div>

    <div class="bulk-list" id="bulk-list"></div>
  </div>

  <p class="note">All generation happens in your browser. Nothing is sent to any server.</p>
</div>

<div id="toast">Copied!</div>

<script>
const UPPER='ABCDEFGHIJKLMNOPQRSTUVWXYZ',LOWER='abcdefghijklmnopqrstuvwxyz',DIGITS='0123456789',SYMS='!@#$%^&*()-_=+[]{}|;:,.<>?';
const AMBIG=/[O0Il1]/g;

function getChars(){
  let c='';
  if(document.getElementById('uc').checked) c+=UPPER;
  if(document.getElementById('lc').checked) c+=LOWER;
  if(document.getElementById('num').checked) c+=DIGITS;
  if(document.getElementById('sym').checked) c+=SYMS;
  if(document.getElementById('amb').checked) c=c.replace(AMBIG,'');
  return c;
}

function secRand(max){
  // Rejection sampling - eliminates modulo bias for non-power-of-two pool sizes
  const limit=Math.floor(4294967296/max)*max;
  const a=new Uint32Array(1);
  do{crypto.getRandomValues(a);}while(a[0]>=limit);
  return a[0]%max;
}

function buildPw(chars,len,nodup){
  if(!chars)return'';
  const pool=chars.split('');
  // When nodup is on, we cannot produce more chars than the pool contains
  const safeLen=nodup?Math.min(len,pool.length):len;
  let pw='';
  for(let i=0;i<safeLen;i++){
    const idx=secRand(pool.length);
    pw+=pool[idx];
    if(nodup)pool.splice(idx,1);
  }
  return pw;
}

function entropy(pw,pool){return pw&&pool?Math.round(pw.length*Math.log2(pool)):0;}

function strengthInfo(bits){
  if(bits<40)return['Weak',1,'#ff4f4f',18];
  if(bits<60)return['Fair',2,'#ffaa00',40];
  if(bits<80)return['Good',3,'#ffe066',65];
  if(bits<100)return['Strong',4,'#00e5a0',85];
  return['Very strong',5,'#00e5a0',100];
}

let currentPw='';

function generate(){
  const chars=getChars(),len=+document.getElementById('len').value,nodup=document.getElementById('nodup').checked;
  currentPw=buildPw(chars,len,nodup);
  const el=document.getElementById('pw-text');
  el.textContent=currentPw||'Select at least one character set';
  const bits=entropy(currentPw,chars.length);
  const[label,,color,pct]=strengthInfo(bits);
  document.getElementById('sfill').style.width=pct+'%';
  document.getElementById('sfill').style.background=color;
  document.getElementById('strength-label').textContent=currentPw?label:'--';
  document.getElementById('entropy-label').textContent=currentPw?bits+' bits':'-- bits';
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg||'Copied!';
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>t.classList.remove('show'),1800);
}

function copyMain(){
  if(!currentPw)return;
  navigator.clipboard.writeText(currentPw).then(()=>showToast('Password copied!'));
}

function bulkGen(){
  const n=+document.getElementById('bulk-n').value,chars=getChars(),len=+document.getElementById('len').value,nodup=document.getElementById('nodup').checked;
  const list=document.getElementById('bulk-list');
  list.innerHTML='';
  for(let i=0;i<n;i++){
    const pw=buildPw(chars,len,nodup)||'(select a character set)';
    const item=document.createElement('div');
    item.className='bulk-item';
    const pwSpan=document.createElement('span');
    pwSpan.textContent=pw;
    const hint=document.createElement('span');
    hint.className='bulk-item-hint';
    hint.textContent='copy';
    item.appendChild(pwSpan);
    item.appendChild(hint);
    item.addEventListener('click',()=>navigator.clipboard.writeText(pw).then(()=>showToast('Copied!')));
    list.appendChild(item);
  }
}

generate();
</script>
</body>
</html>
